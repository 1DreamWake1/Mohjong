resolver 127.0.0.11 valid=10s ipv6=off;

upstream mahjong_server {
  zone mahjong_server 64k;
  server server:3000 resolve;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 安全响应头：阻止 MIME 嗅探、点击劫持，并收紧引用来源。
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  # 同源 SPA 的 CSP：脚本仅允许同源，样式允许内联（React 内联样式），
  # 连接允许同源与 WebSocket（Socket.IO）。
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

  location /socket.io/ {
    proxy_pass http://mahjong_server;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 65s;
  }

  location ~ ^/(api|auth|rooms|games|admin|health|ready)(/|$) {
    proxy_pass http://mahjong_server;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
