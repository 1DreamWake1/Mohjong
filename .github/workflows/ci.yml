name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Install / Format / Typecheck / Lint / Test / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  smoke:
    name: Docker image migration / probes / login / socket smoke test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (for smoke script)
        run: pnpm install --frozen-lockfile

      - name: Prepare .env
        run: |
          echo "AUTH_TOKEN_SECRET=ci-only-secret-change-me-0123456789" >> .env
          echo "POSTGRES_PASSWORD=ci-postgres-password" >> .env
          echo "WEB_PORT=8080" >> .env
          echo "ADMIN_USERNAME=admin" >> .env
          echo "ADMIN_PASSWORD=admin1234567" >> .env

      - name: Build and start stack
        run: |
          docker compose build
          docker compose up -d --wait

      - name: Wait for readiness probe
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/ready > /dev/null; then
              echo "Server is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Server did not become ready" >&2
          docker compose logs server
          exit 1

      - name: Seed admin
        run: |
          docker compose exec \
            -e ADMIN_USERNAME=admin \
            -e ADMIN_PASSWORD=admin1234567 \
            server node ./apps/server/dist/scripts/seedAdmin.js

      - name: Run smoke script (probes / login / socket)
        run: |
          SMOKE_BASE_URL=http://127.0.0.1:8080 \
          SMOKE_USERNAME=admin \
          SMOKE_PASSWORD=admin1234567 \
          pnpm --filter server run smoke

      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose logs --tail 200 server
          docker compose logs --tail 100 web

      - name: Tear down stack
        if: always()
        run: docker compose down -v

  e2e:
    name: Playwright end-to-end tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          if-no-files-found: ignore
