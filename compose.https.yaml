services:
  web:
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./deploy/tls:/etc/nginx/tls:ro
      - ./apps/web/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--no-check-certificate",
          "-O",
          "/dev/null",
          "https://127.0.0.1:8443/health"
        ]
