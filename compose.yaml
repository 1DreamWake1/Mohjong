services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?Set AUTH_TOKEN_SECRET in .env}
      BACKUP_DIR: /app/backups
      BACKUP_KEEP: ${BACKUP_KEEP:-5}
      BACKUP_ON_BOOT: ${BACKUP_ON_BOOT:-1}
      DATABASE_URL: file:/app/data/mahjong.db
      HOST: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 15s
    volumes:
      - mahjong-data:/app/data
      - mahjong-backups:/app/backups

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    ports:
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped
    stop_grace_period: 10s

volumes:
  mahjong-data:
  mahjong-backups:
