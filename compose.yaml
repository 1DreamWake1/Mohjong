services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      args:
        PRISMA_SCHEMA: ${PRISMA_SCHEMA:-prisma/schema.prisma}
    environment:
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?Set AUTH_TOKEN_SECRET in .env}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-mahjong_session}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-1}
      BACKUP_DIR: /app/backups
      BACKUP_KEEP: ${BACKUP_KEEP:-5}
      BACKUP_ON_BOOT: ${BACKUP_ON_BOOT:-1}
      BODY_LIMIT_BYTES: ${BODY_LIMIT_BYTES:-65536}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      DATABASE_URL: ${DATABASE_URL:-file:/app/data/mahjong.db}
      HOST: 0.0.0.0
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-10}
      LOGIN_RATE_LIMIT_WINDOW_MS: ${LOGIN_RATE_LIMIT_WINDOW_MS:-60000}
      NODE_ENV: production
      PORT: 3000
      PRISMA_SCHEMA: ${PRISMA_SCHEMA:-prisma/schema.prisma}
      REDIS_URL: ${REDIS_URL:-}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      SOCKET_ACTION_RATE_LIMIT_MAX: ${SOCKET_ACTION_RATE_LIMIT_MAX:-30}
      SOCKET_ACTION_RATE_LIMIT_WINDOW_MS: ${SOCKET_ACTION_RATE_LIMIT_WINDOW_MS:-10000}
      SOCKET_CONNECTION_RATE_LIMIT_MAX: ${SOCKET_CONNECTION_RATE_LIMIT_MAX:-20}
      SOCKET_CONNECTION_RATE_LIMIT_WINDOW_MS: ${SOCKET_CONNECTION_RATE_LIMIT_WINDOW_MS:-60000}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 15s
    volumes:
      - mahjong-data:/app/data
      - mahjong-backups:/app/backups

  postgres:
    image: postgres:16-alpine
    profiles: ["scale"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mahjong}
      POSTGRES_USER: ${POSTGRES_USER:-mahjong}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD when using the scale profile}
    volumes:
      - mahjong-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["scale"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - mahjong-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    ports:
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped
    stop_grace_period: 10s

volumes:
  mahjong-data:
  mahjong-backups:
  mahjong-postgres:
  mahjong-redis:
